<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | FSS Transport</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            <img src="img/ffs_bg_removal.png" alt="FSS Transport">
        </div>

        <h1>Admin Login</h1>
        <p class="auth-subtitle">Staff access only. Manage routes, trips, and terminals.</p>

        <form id="admin-login-form">

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="admin-email" placeholder="admin@fss.ng">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="admin-password" placeholder="••••••••">
            </div>

            <button type="submit" class="auth-submit">Sign In</button>

        </form>

        <p class="auth-switch">
            <a href="index.html">← Back to FSS Transport</a>
        </p>

    </div>

</section>

<script src="index.js"></script>
<script src="api.js"></script>
<script src="admin-login.js"></script>
</body>
</html>
