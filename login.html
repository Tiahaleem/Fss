<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | FSS Transport</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
<nav class="navbar">

    <div class="logo">
        <img src="img/ffs_bg_removal.png" alt="FSS LOGO">
    </div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="book_a_trip.html">Book a Trip</a></li>
        <li><a href="route.html">Routes</a></li>
        <li><a href="pickup.html">Pickup Centers</a></li>
        <li><a href="courier.html">Courier</a></li>
        <li><a href="track.html">Track</a></li>
        <li><a href="about.html">About</a></li>
    </ul>

    <div class="nav-buttons">
        <a href="login.html" class="signin">Sign In</a>
        <a href="signup.html" class="btn-primary">Get Started</a>
    </div>

    <div class="hamburger">
        ☰
    </div>

</nav>

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            <img src="img/ffs_bg_removal.png" alt="FSS Transport">
        </div>

        <h1>Welcome back</h1>
        <p class="auth-subtitle">Sign in to manage your bookings and parcels.</p>

        <div id="google-signin-button"></div>

        <div class="auth-divider">or sign in with email</div>

        <form id="login-form">

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="password-field">
                    <input type="password" id="login-password" placeholder="••••••••">
                    <button type="button" class="password-toggle-btn"></button>
                </div>
            </div>

            <div class="auth-options">
                <label class="remember-me">
                    <input type="checkbox">
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="auth-submit">Sign In</button>

        </form>

        <p class="auth-switch">
            Don't have an account? <a href="signup.html">Create one</a>
        </p>

    </div>

</section>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="index.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
</body>
</html>
