<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | FSS Transport</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
<nav class="navbar">

    <div class="logo">
        <img src="img/ffs_bg_removal.png" alt="FSS LOGO">
    </div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="book_a_trip.html">Book a Trip</a></li>
        <li><a href="route.html">Routes</a></li>
        <li><a href="pickup.html">Pickup Centers</a></li>
        <li><a href="courier.html">Courier</a></li>
        <li><a href="track.html">Track</a></li>
        <li><a href="about.html">About</a></li>
    </ul>

    <div class="nav-buttons">
        <a href="login.html" class="signin">Sign In</a>
        <a href="signup.html" class="btn-primary">Get Started</a>
    </div>

    <div class="hamburger">
        ☰
    </div>

</nav>

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            <img src="img/ffs_bg_removal.png" alt="FSS Transport">
        </div>

        <h1>Welcome back</h1>
        <p class="auth-subtitle">Sign in to manage your bookings and parcels.</p>

        <!-- Placeholder until Google OAuth (Client ID + backend token
             exchange) is set up — see auth.js -->
        <button type="button" class="google-btn">
            <svg width="20" height="20" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" />
                <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" />
                <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z" />
                <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z" />
            </svg>
            Continue with Google
        </button>

        <div class="auth-divider">or sign in with email</div>

        <form id="login-form">

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>

            <div class="auth-options">
                <label class="remember-me">
                    <input type="checkbox">
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="auth-submit">Sign In</button>

        </form>

        <p class="auth-switch">
            Don't have an account? <a href="signup.html">Create one</a>
        </p>

    </div>

</section>

<script src="index.js"></script>
<script src="auth.js"></script>
</body>
</html>
